name: Build Custom OpenWrt & Merge Full Flash Dump

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_merge:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      # ==========================================
      # 1. Checkout Repository
      # ==========================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. Initialize Build Dependencies
      # ==========================================
      - name: Initialize Environment Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            ack antlr3 asciidoc autoconf automake autopoint \
            binutils bison build-essential bzip2 ccache cmake \
            cpio curl device-tree-compiler fastjar flex gawk \
            gettext gcc-multilib g++-multilib git gperf \
            haveged help2man intltool libc6-dev-i386 libelf-dev \
            libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses5-dev libncursesw5-dev \
            libreadline-dev libssl-dev libtool lrzsz mkisofs \
            msmtp nano p7zip-full patch pkgconf python3 \
            python3-pip qemu-utils rsync scons squashfs-tools \
            subversion swig texinfo u-boot-tools unzip xmlto \
            xz-utils zlib1g-dev libz-dev time xxd

          sudo apt-get clean

      # ==========================================
      # 3. Clone OpenWrt
      # ==========================================
      - name: Clone OpenWrt Source Code
        run: |
          set -eux

          git clone \
            --branch openwrt-23.05 \
            --single-branch \
            https://github.com/openwrt/openwrt.git \
            openwrt

          cd openwrt

          echo "=== OpenWrt version ==="
          git log -1 --oneline

      # ==========================================
      # 4. Update Feeds
      # ==========================================
      - name: Update & Install Feeds
        run: |
          set -eux

          cd openwrt

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # ==========================================
      # 5. Validate and Inject Device Files
      # ==========================================
      - name: Inject Custom Board Map & Settings
        run: |
          set -eu

          echo "=== Repository device files ==="

          find target/linux/ipq40xx -type f \
            \( -name  *.dts  -o -name  *.dtsi  -o -name  *.mk  \) \
            -print || true

          echo "=== Locate GAPD-7200 DTS ==="

          DTS_FILE="$(find target/linux/ipq40xx -type f \
            -name  qcom-ipq4019-gapd7200.dts  -print -quit)"

          if [ -z "$DTS_FILE" ]; then
            echo "ERROR: qcom-ipq4019-gapd7200.dts was not found."
            echo "Check the DTS filename in the repository."
            exit 1
          fi

          echo "Using DTS: $DTS_FILE"

          DTS_DEST="openwrt/target/linux/ipq40xx/files/arch/arm/boot/dts"

          mkdir -p "$DTS_DEST"

          cp "$DTS_FILE" "$DTS_DEST/"

          echo "=== Copy custom files ==="

          if [ -d files ]; then
            mkdir -p openwrt/files
            cp -a files/. openwrt/files/
          else
            echo "No repository files/ overlay found."
          fi

          echo "=== Inject device image definition ==="

          if [ ! -f src/generic-extra.mk ]; then
            echo "ERROR: src/generic-extra.mk was not found."
            exit 1
          fi

          if grep -q  Device/davolink_gapd-7200  \
            openwrt/target/linux/ipq40xx/image/generic.mk; then
            echo "ERROR: Device definition already exists upstream."
            echo "Avoid defining the same device twice."
            exit 1
          fi

          cat src/generic-extra.mk \
            >> openwrt/target/linux/ipq40xx/image/generic.mk

          echo "=== Verify injected definition ==="

          grep -n -A20 -B2 \
             Device/davolink_gapd-7200  \
            openwrt/target/linux/ipq40xx/image/generic.mk

          echo "=== Verify DTS destination ==="

          ls -lh "$DTS_DEST"

      # ==========================================
      # 6. Configure OpenWrt
      # ==========================================
      - name: Load Config Seed
        run: |
          set -eux

          cat > openwrt/.config << EOF 
          CONFIG_TARGET_ipq40xx=y
          CONFIG_TARGET_ipq40xx_generic=y
          CONFIG_TARGET_ipq40xx_generic_DEVICE_davolink_gapd-7200=y

          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-ssl=y
          CONFIG_PACKAGE_kmod-eoip=y
          CONFIG_PACKAGE_lldpd=y
          CONFIG_PACKAGE_luci-app-watchcat=y
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-app-argon-config=y
          CONFIG_PACKAGE_luci-i18n-base-ar=y
          EOF

          cd openwrt

          make defconfig

          echo "=== Verify target configuration ==="

          grep -E \
             CONFIG_TARGET_ipq40xx|CONFIG_PACKAGE_luci|davolink  \
            .config || true

          if ! grep -q \
             ^CONFIG_TARGET_ipq40xx_generic_DEVICE_davolink_gapd-7200=y$  \
            .config; then
            echo "ERROR: The Davolink device profile was removed by make defconfig."
            echo "The device definition may not be registered correctly."
            exit 1
          fi

      # ==========================================
      # 7. Verify Image Definition Before Build
      # ==========================================
      - name: Validate Device Image Definition
        run: |
          set -eu

          echo "=== Device definition ==="

          grep -n -A20 -B2 \
             Device/davolink_gapd-7200  \
            openwrt/target/linux/ipq40xx/image/generic.mk

          echo "=== Image generation helpers ==="

          grep -n -E \
             define Device/FitImageLzma|define Device/FitImage|append-kernel|append-rootfs|append-metadata  \
            openwrt/target/linux/ipq40xx/image/generic.mk \
            openwrt/target/linux/ipq40xx/image/*.mk || true

          echo "=== Device tree ==="

          find openwrt/target/linux/ipq40xx/files \
            -type f -name  *gapd7200*  -print

      # ==========================================
      # 8. Compile Firmware
      # ==========================================
      - name: Compile Custom Firmware
        id: compile
        continue-on-error: true
        run: |
          cd openwrt

          set -o pipefail

          make -j1 V=s 2>&1 | tee build.log

      # ==========================================
      # 9. Diagnose Build Results
      # ==========================================
      - name: Debug Build Results
        if: always()
        run: |
          echo "======================================"
          echo "BUILD RESULT"
          echo "======================================"

          echo "=== Build directory ==="

          if [ -d openwrt/build_dir ]; then
            echo "build_dir exists"
          else
            echo "build_dir does not exist"
          fi

          echo "=== GAPD kernel and DTB files ==="

          find openwrt/build_dir -type f \
            \( -iname  *gapd*kernel*  \
               -o -iname  *gapd*.dtb  \
               -o -iname  *gapd*.itb  \) \
            -print 2>/dev/null || true

          echo "=== Generated target images ==="

          find openwrt/bin/targets -type f \
            -print 2>/dev/null || true

          echo "=== Relevant build errors ==="

          if [ -f openwrt/build.log ]; then
            grep -n -i -E \
               error:|no such file|undefined|failed to build|cannot stat|unary operator expected|Error [0-9]  \
              openwrt/build.log | tail -100 || true

            echo "=== Last 100 lines of build log ==="

            tail -100 openwrt/build.log
          else
            echo "Build log was not created."
          fi

      # ==========================================
      # 10. Upload Firmware Artifacts
      # ==========================================
      - name: Upload Custom Firmware
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-Davolink-GAPD7200-Firmware
          path: |
            openwrt/bin/targets/ipq40xx/generic/
          if-no-files-found: warn
          retention-days: 30

      # ==========================================
      # 11. Upload Build Logs
      # ==========================================
      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-Davolink-GAPD7200-Build-Logs
          path: |
            openwrt/build.log
            openwrt/.config
            openwrt/tmp/
            openwrt/logs/
          if-no-files-found: ignore
          retention-days: 30

      # ==========================================
      # 12. Fail Workflow if Compilation Failed
      # ==========================================
      - name: Check Compilation Status
        if: always()
        env:
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
        run: |
          if [ "$COMPILE_OUTCOME" != "success" ]; then
            echo "ERROR: OpenWrt compilation failed."
            echo "Download the Build Logs artifact to inspect the failure."
            exit 1
          fi

          echo "OpenWrt compilation completed successfully."
