name: Build OpenWrt for Davolink GAPD-7200

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build GAPD-7200 Firmware
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      # --------------------------------------------------
      # 1. Checkout your repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Install build dependencies
      # --------------------------------------------------
      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-distutils \
            python3-setuptools \
            rsync \
            swig \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            time \
            ccache \
            device-tree-compiler \
            libelf-dev \
            ecj \
            fastjar \
            java-propose-classpath

      # --------------------------------------------------
      # 3. Clone OpenWrt 23.05
      # --------------------------------------------------
      - name: Clone OpenWrt
        run: |
          git clone \
            --depth 1 \
            --branch openwrt-23.05 \
            https://github.com/openwrt/openwrt.git \
            openwrt

      # --------------------------------------------------
      # 4. Update and install feeds
      # --------------------------------------------------
      - name: Update feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # --------------------------------------------------
      # 5. Inspect repository files
      # --------------------------------------------------
      - name: Inspect Davolink source files
        run: |
          echo "=========================================="
          echo "Repository source files"
          echo "=========================================="

          echo "Current repository:"
          pwd

          echo "Files in src:"
          if [ -d src ]; then
            find src -maxdepth 2 -type f -print
          else
            echo "ERROR: src directory does not exist"
            exit 1
          fi

          echo "Device tree source files:"
          find target/linux/ipq40xx/files/arch/arm/boot/dts \
            -type f -print 2>/dev/null || true

          echo "=========================================="

      # --------------------------------------------------
      # 6. Install the Davolink DTS
      # --------------------------------------------------
      - name: Install Davolink device tree
        run: |
          set -eu

          DTS_SOURCE=""

          # Look for a GAPD-7200 device tree in the repository.
          DTS_SOURCE="$(find target/linux/ipq40xx/files/arch/arm/boot/dts \
            -type f \
            \( -iname  *gapd*7200*.dts  \
            -o -iname  *gapd*7200*.dtsi  \) \
            -print -quit 2>/dev/null || true)"

          if [ -z "$DTS_SOURCE" ]; then
            echo "ERROR: No GAPD-7200 DTS/DTSI file found."
            echo "Available DTS files:"
            find target/linux/ipq40xx/files/arch/arm/boot/dts \
              -type f -print 2>/dev/null || true
            exit 1
          fi

          DTS_NAME="$(basename "$DTS_SOURCE")"

          echo "Found device tree: $DTS_SOURCE"

          DEST="openwrt/target/linux/ipq40xx/files/arch/arm/boot/dts/$DTS_NAME"

          mkdir -p "$(dirname "$DEST")"
          cp "$DTS_SOURCE" "$DEST"

          echo "Installed DTS: $DEST"

          # Verify that the board identity appears in the file.
          if ! grep -qi  gapd-7200  "$DEST"; then
            echo "WARNING: GAPD-7200 was not found in the DTS filename/content."
            echo "Review the device tree before using the firmware."
          fi

      # --------------------------------------------------
      # 7. Install repository overlay files
      # --------------------------------------------------
      - name: Install filesystem overlay
        run: |
          set -eu

          if [ -d files ]; then
            echo "Installing files/ overlay"

            cp -a files/. openwrt/files/

            echo "Overlay installed."
          else
            echo "No files/ overlay directory found; skipping."
          fi

      # --------------------------------------------------
      # 8. Register the image definition
      # --------------------------------------------------
      - name: Register Davolink image definition
        working-directory: openwrt
        run: |
          set -eu

          EXTRA_FILE="../src/generic-extra.mk"
          IMAGE_FILE="target/linux/ipq40xx/image/generic.mk"

          echo "Checking image definition files..."

          if [ ! -f "$EXTRA_FILE" ]; then
            echo "ERROR: $EXTRA_FILE not found."
            exit 1
          fi

          if [ ! -f "$IMAGE_FILE" ]; then
            echo "ERROR: $IMAGE_FILE not found."
            find target/linux/ipq40xx/image -maxdepth 2 -type f -print
            exit 1
          fi

          echo "Checking for an existing Davolink profile..."

          if grep -R -q \
             Device/davolink_gapd-7200  \
            target/linux/ipq40xx/image \
            --include= *.mk ; then

            echo "A Davolink device definition already exists."
            echo "Will not append a duplicate definition."

          else
            echo "Appending src/generic-extra.mk to generic.mk"

            cat "$EXTRA_FILE" >> "$IMAGE_FILE"
          fi

          echo "Checking the registered definition..."

          grep -R -n -A 15 -B 3 \
             Device/davolink_gapd-7200  \
            target/linux/ipq40xx/image \
            --include= *.mk  || true

          echo "Checking TARGET_DEVICES registration..."

          grep -R -n \
             TARGET_DEVICES.*davolink_gapd-7200  \
            target/linux/ipq40xx/image \
            --include= *.mk  || true

      # --------------------------------------------------
      # 9. Inspect the target image infrastructure
      # --------------------------------------------------
      - name: Inspect target image infrastructure
        working-directory: openwrt
        run: |
          echo "=========================================="
          echo "Target image infrastructure"
          echo "=========================================="

          echo "Image Makefiles:"
          find target/linux/ipq40xx/image \
            -maxdepth 2 \
            -type f \
            -name  *.mk  \
            -print

          echo "Device helper definitions:"
          grep -R -n \
             Device/FitImageLzma  \
            target/linux/ipq40xx/image \
            target/linux/ipq40xx \
            --include= *.mk  || true

          echo "Image size helper definitions:"
          grep -R -n \
             check-size  \
            target/linux/ipq40xx/image \
            --include= *.mk  || true

          echo "=========================================="

      # --------------------------------------------------
      # 10. Configure the target
      # --------------------------------------------------
      - name: Configure OpenWrt target
        working-directory: openwrt
        run: |
          set -eu

          echo "Selecting ipq40xx/generic target..."

          cat > .config << EOF 
          CONFIG_TARGET_ipq40xx=y
          CONFIG_TARGET_ipq40xx_generic=y
          CONFIG_TARGET_ipq40xx_generic_DEVICE_davolink_gapd-7200=y
          EOF

          echo "Initial device configuration:"
          cat .config

          echo "Running make defconfig..."

          make defconfig

          echo "Configuration after make defconfig:"
          grep -E \
             CONFIG_TARGET_ipq40xx|CONFIG_TARGET_SUBTARGET|CONFIG_TARGET_DEVICE  \
            .config || true

      # --------------------------------------------------
      # 11. Debug device registration
      # --------------------------------------------------
      - name: Debug Davolink device registration
        if: always()
        working-directory: openwrt
        run: |
          echo "=========================================="
          echo "Davolink registration diagnostics"
          echo "=========================================="

          echo "Device definition:"
          grep -R -n -A 15 -B 5 \
             davolink_gapd-7200  \
            target/linux/ipq40xx/image \
            target/linux/ipq40xx/Makefile \
            --include= *.mk  || true

          echo "DTS files:"
          find target/linux/ipq40xx \
            -type f \
            \( -iname  *gapd*7200*  -o -iname  *horuspro*  \) \
            -print || true

          echo "Device configuration:"
          grep \
             CONFIG_TARGET_ipq40xx_generic_DEVICE_davolink_gapd-7200  \
            .config || true

          echo "Image definitions:"
          grep -R -n \
             TARGET_DEVICES.*davolink_gapd-7200  \
            target/linux/ipq40xx/image \
            --include= *.mk  || true

          echo "=========================================="

      # --------------------------------------------------
      # 12. Validate the device configuration
      # --------------------------------------------------
      - name: Validate Davolink configuration
        working-directory: openwrt
        run: |
          set -eu

          if ! grep -q \
             ^CONFIG_TARGET_ipq40xx_generic_DEVICE_davolink_gapd-7200=y$  \
            .config; then

            echo "ERROR: Davolink device profile was removed by make defconfig."
            echo "Check the registration diagnostics above."
            echo "The device profile must be recognized before compilation."
            exit 1
          fi

          echo "Davolink device profile is enabled."

      # --------------------------------------------------
      # 13. Download sources
      # --------------------------------------------------
      - name: Download package sources
        working-directory: openwrt
        run: |
          make download -j8

      # --------------------------------------------------
      # 14. Compile OpenWrt
      # --------------------------------------------------
      - name: Compile OpenWrt
        id: compile
        continue-on-error: true
        working-directory: openwrt
        run: |
          set -o pipefail

          make -j1 V=s 2>&1 | tee build.log

      # --------------------------------------------------
      # 15. Display build errors
      # --------------------------------------------------
      - name: Show Build Errors
        if: always()
        working-directory: openwrt
        run: |
          echo "=========================================="
          echo "Build log diagnostics"
          echo "=========================================="

          if [ -f build.log ]; then
            echo "Searching for errors..."

            grep -n -i -E \
               error:|fatal error:|undefined reference|No rule to make target|recipe for target|Error [0-9]|failed  \
              build.log | tail -n 100 || true

            echo "Last 150 lines of build.log:"
            tail -n 150 build.log
          else
            echo "build.log does not exist."
          fi

          echo "=========================================="

      # --------------------------------------------------
      # 16. List generated images
      # --------------------------------------------------
      - name: List generated images
        if: always()
        working-directory: openwrt
        run: |
          echo "Generated target files:"

          find bin/targets/ipq40xx/generic \
            -maxdepth 2 \
            -type f \
            -printf  %p (%s bytes)\n  2>/dev/null || true

      # --------------------------------------------------
      # 17. Upload build artifacts and logs
      # --------------------------------------------------
      - name: Upload build artifacts and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: davolink-gapd7200-build
          if-no-files-found: warn
          path: |
            openwrt/bin/targets/ipq40xx/generic/
            openwrt/build.log
            openwrt/.config

      # --------------------------------------------------
      # 18. Report compilation result
      # --------------------------------------------------
      - name: Check compilation result
        if: always()
        run: |
          if [ "${{ steps.compile.outcome }}" != "success" ]; then
            echo "ERROR: OpenWrt compilation failed."
            echo "Download the davolink-gapd7200-build artifact."
            exit 1
          fi

          echo "OpenWrt compilation step completed."
