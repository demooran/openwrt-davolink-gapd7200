name: Build OpenWrt for Davolink GAPD-7200

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build GAPD-7200 Firmware
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Install dependencies
      # --------------------------------------------------
      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            rsync \
            swig \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            time \
            device-tree-compiler \
            libelf-dev

      # --------------------------------------------------
      # 3. Clone OpenWrt 23.05
      # --------------------------------------------------
      - name: Clone OpenWrt
        shell: bash
        run: |
          git clone \
            --depth 1 \
            --branch openwrt-23.05 \
            https://github.com/openwrt/openwrt.git \
            openwrt

      # --------------------------------------------------
      # 4. Update feeds
      # --------------------------------------------------
      - name: Update feeds
        working-directory: openwrt
        shell: bash
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # --------------------------------------------------
      # 5. Check source files
      # --------------------------------------------------
      - name: Check repository files
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Repository root ==="
          pwd

          echo "=== src directory ==="

          if [[ ! -f src/generic-extra.mk ]]; then
            echo "ERROR: src/generic-extra.mk does not exist."
            exit 1
          fi

          echo "=== DTS files ==="

          find target/linux/ipq40xx/files/arch/arm/boot/dts \
            -type f -print 2>/dev/null || true

      # --------------------------------------------------
      # 6. Copy DTS
      # --------------------------------------------------
      - name: Install Davolink DTS
        shell: bash
        run: |
          set -euo pipefail

          DTS_SOURCE="target/linux/ipq40xx/files/arch/arm/boot/dts/qcom-ipq4019-gapd7200.dts"

          DTS_DEST="openwrt/target/linux/ipq40xx/files/arch/arm/boot/dts/qcom-ipq4019-gapd7200.dts"

          if [[ ! -f "$DTS_SOURCE" ]]; then
            echo "ERROR: DTS source not found:"
            echo "$DTS_SOURCE"
            find target/linux/ipq40xx/files/arch/arm/boot/dts \
              -type f -print || true
            exit 1
          fi

          mkdir -p "$(dirname "$DTS_DEST")"
          cp "$DTS_SOURCE" "$DTS_DEST"

          echo "DTS copied successfully."
          echo "Destination: $DTS_DEST"

          echo "=== Board identity ==="

          grep -n -i -E \
             model|compatible|gapd-7200  \
            "$DTS_DEST" || true

      # --------------------------------------------------
      # 7. Copy filesystem overlay
      # --------------------------------------------------
      - name: Install filesystem overlay
        shell: bash
        run: |
          set -euo pipefail

          if [[ -d files ]]; then
            mkdir -p openwrt/files
            cp -a files/. openwrt/files/
            echo "Filesystem overlay copied."
          else
            echo "No files/ directory found. Skipping."
          fi

      # --------------------------------------------------
      # 8. Register device image definition
      # --------------------------------------------------
      - name: Register Davolink image definition
        working-directory: openwrt
        shell: bash
        run: ../scripts/register-davolink-device.sh

      # --------------------------------------------------
      # 9. Check image helper definitions
      # --------------------------------------------------
      - name: Inspect image infrastructure
        working-directory: openwrt
        shell: bash
        run: |
          echo "=== Image Makefiles ==="

          find target/linux/ipq40xx/image \
            -maxdepth 2 \
            -type f \
            -name  *.mk  -print

          echo "=== FitImageLzma helpers ==="

          grep -R -n \
             Device/FitImageLzma  \
            target/linux/ipq40xx \
            --include= *.mk  || true

          echo "=== Image construction helpers ==="

          grep -R -n -E \
             append-kernel|append-rootfs|pad-to|pad-rootfs|append-metadata|check-size  \
            target/linux/ipq40xx/image \
            --include= *.mk  || true

      # --------------------------------------------------
      # 10. Check DTS integration
      # --------------------------------------------------
      - name: Check DTS integration
        working-directory: openwrt
        shell: bash
        run: |
          set -euo pipefail

          DTS_FILE="target/linux/ipq40xx/files/arch/arm/boot/dts/qcom-ipq4019-gapd7200.dts"

          if [[ ! -f "$DTS_FILE" ]]; then
            echo "ERROR: DTS file does not exist."
            exit 1
          fi

          echo "=== References to GAPD-7200 DTS ==="

          grep -R -n \
             qcom-ipq4019-gapd7200  \
            target/linux/ipq40xx \
            --include= *.mk  \
            --include= Makefile  || true

          echo "DTS reference inspection completed."

      # --------------------------------------------------
      # 11. Configure OpenWrt
      # --------------------------------------------------
      - name: Configure OpenWrt
        working-directory: openwrt
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Device definition before defconfig ==="

          grep -R -n \
             Device/davolink_gapd-7200  \
            target/linux/ipq40xx/image \
            --include= *.mk 

          echo "=== TARGET_DEVICES before defconfig ==="

          grep -R -n \
             TARGET_DEVICES.*davolink_gapd-7200  \
            target/linux/ipq40xx/image \
            --include= *.mk 

          echo "=== Write initial configuration ==="

          cat > .config << EOF 
          CONFIG_TARGET_ipq40xx=y
          CONFIG_TARGET_ipq40xx_generic=y
          CONFIG_TARGET_ipq40xx_generic_DEVICE_davolink_gapd-7200=y
          EOF

          echo "=== Run make defconfig ==="

          make defconfig

          echo "=== Configuration after defconfig ==="

          grep -E \
             ^CONFIG_TARGET_ipq40xx|^CONFIG_TARGET_SUBTARGET  \
            .config || true

      # --------------------------------------------------
      # 12. Diagnose device registration
      # --------------------------------------------------
      - name: Debug Davolink registration
        if: always()
        working-directory: openwrt
        shell: bash
        run: |
          echo "=========================================="
          echo "Davolink registration diagnostics"
          echo "=========================================="

          echo "=== Device definition ==="

          grep -R -n -A 15 -B 5 \
             davolink_gapd-7200  \
            target/linux/ipq40xx/image \
            target/linux/ipq40xx/Makefile \
            --include= *.mk  || true

          echo "=== DTS files ==="

          find target/linux/ipq40xx \
            -type f \
            \( -iname  *gapd*7200*  -o -iname  *horuspro*  \) \
            -print || true

          echo "=== Device configuration ==="

          grep \
             CONFIG_TARGET_ipq40xx_generic_DEVICE_davolink_gapd-7200  \
            .config || true

          echo "=== Target profile files ==="

          find target/linux/ipq40xx \
            -maxdepth 3 \
            -type f \
            \( -name  Makefile  -o -name  Config.in  \) \
            -print

          echo "=========================================="

      # --------------------------------------------------
      # 13. Validate device configuration
      # --------------------------------------------------
      - name: Validate Davolink configuration
        working-directory: openwrt
        shell: bash
        run: |
          set -euo pipefail

          if ! grep -q \
             ^CONFIG_TARGET_ipq40xx_generic_DEVICE_davolink_gapd-7200=y$  \
            .config; then

            echo "ERROR: Davolink device profile was removed by make defconfig."
            echo "The device is not recognized by the generated target configuration."
            echo "Check the registration diagnostics."
            exit 1
          fi

          echo "Davolink profile is enabled."

      # --------------------------------------------------
      # 14. Download package sources
      # --------------------------------------------------
      - name: Download package sources
        working-directory: openwrt
        shell: bash
        run: |
          make download -j8

      # --------------------------------------------------
      # 15. Compile OpenWrt
      # --------------------------------------------------
      - name: Compile OpenWrt
        id: compile
        continue-on-error: true
        working-directory: openwrt
        shell: bash
        run: |
          set -o pipefail
          make -j1 V=s 2>&1 | tee build.log

      # --------------------------------------------------
      # 16. Show compilation errors
      # --------------------------------------------------
      - name: Show Build Errors
        if: always()
        working-directory: openwrt
        shell: bash
        run: |
          echo "=== Build log ==="

          if [[ -f build.log ]]; then
            grep -n -i -E \
               error:|fatal error:|undefined reference|No rule to make target|Error [0-9]|failed  \
              build.log | tail -n 100 || true

            echo "=== Last 150 lines ==="
            tail -n 150 build.log
          else
            echo "build.log does not exist."
          fi

      # --------------------------------------------------
      # 17. List generated images
      # --------------------------------------------------
      - name: List generated images
        if: always()
        working-directory: openwrt
        shell: bash
        run: ../scripts/list-generated-images.sh

      # --------------------------------------------------
      # 18. Upload artifacts and logs
      # --------------------------------------------------
      - name: Upload build artifacts and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: davolink-gapd7200-build
          if-no-files-found: warn
          path: |
            openwrt/bin/targets/ipq40xx/generic/
            openwrt/build.log
            openwrt/.config

      # --------------------------------------------------
      # 19. Final status
      # --------------------------------------------------
      - name: Check compilation result
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.compile.outcome }}" != "success" ]]; then
            echo "ERROR: OpenWrt compilation failed or was skipped."
            exit 1
          fi

          echo "OpenWrt compilation step completed."
