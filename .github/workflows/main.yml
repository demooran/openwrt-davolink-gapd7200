name: Build Custom OpenWrt & Merge Full Flash Dump

on:
  workflow_dispatch:

jobs:
  build_and_merge:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Initialize Environment Dependencies
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp nano p7zip p7zip-full patch pkgconf python3 python3-pip qemu-utils rsync scons squashfs-tools subversion swig texinfo u-boot-tools upx-ucl unzip xmlto xz-utils zlib1g-dev libz-dev time xxd
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean

    - name: Clone OpenWrt Source Code
      run: |
        git clone https://github.com/openwrt/openwrt.git openwrt
        cd openwrt
        git checkout openwrt-23.05

    - name: Update & Install Feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Inject Custom Board Map & Settings
      run: |
        mkdir -p openwrt/target/linux/ipq40xx/files/arch/arm/boot/dts/
        if [ -f "target/linux/ipq40xx/files/arch/arm/boot/dts/qcom-ipq4019-gapd7200.dts" ]; then
          cp target/linux/ipq40xx/files/arch/arm/boot/dts/qcom-ipq4019-gapd7200.dts openwrt/target/linux/ipq40xx/files/arch/arm/boot/dts/
        fi
        
        if [ -d "files" ]; then
          echo "تم العثور على مجلد files المخصص..."
          mkdir -p openwrt/files
          cp -r files/* openwrt/files/
        fi
        cp files/generic-extra.mk openwrt/files/ 2>/dev/null || true
        echo "" >> openwrt/target/linux/ipq40xx/image/generic.mk
        cat files/generic-extra.mk >> openwrt/target/linux/ipq40xx/image/generic.mk
        

    - name: Load Config Seed
      run: |
        cat << 'EOF' > openwrt/.config
        CONFIG_TARGET_ipq40xx=y
        CONFIG_TARGET_ipq40xx_generic=y
        CONFIG_TARGET_DEVICE_ipq40xx_generic_DEVICE_davolink_gapd-7200=y
        CONFIG_PACKAGE_luci=y
        CONFIG_PACKAGE_luci-ssl=y
        CONFIG_PACKAGE_kmod-eoip=y
        CONFIG_PACKAGE_lldpd=y
        CONFIG_PACKAGE_luci-app-watchcat=y
        CONFIG_PACKAGE_luci-app-ttyd=y
        EOF
        cd openwrt
        make defconfig

    - name: Compile Custom Firmware
      run: |
        cd openwrt
        make -j$(nproc) || make -j1 V=s

    - name: List Build Output
      if: always()
      run: |
        echo "═══════ محتوى مجلد الإخراج ═══════"
        ls -lah openwrt/bin/targets/ipq40xx/generic/ 2>/dev/null || echo "المجلد غير موجود!"
        echo ""
        echo "═══ جميع الملفات ═══"
        find openwrt/bin/targets/ -type f 2>/dev/null | head -30

    - name: Upload Custom Firmware (All Images)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: OpenWrt-Davolink-GAPD7200-Firmware
        path: |
          openwrt/bin/targets/ipq40xx/generic/*.bin
          openwrt/bin/targets/ipq40xx/generic/*.itb
          openwrt/bin/targets/ipq40xx/generic/*.ubi
          openwrt/bin/targets/ipq40xx/generic/*.tar.gz
        if-no-files-found: warn
        retention-days: 90

    - name: Upload Build Logs (on failure)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: Build-Logs
        path: |
          openwrt/logs/
          openwrt/.config
          openwrt/tmp/*.log
        if-no-files-found: ignore
        retention-days: 30
