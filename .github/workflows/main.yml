name: Build OpenWrt for Davolink GAPD-7200

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build GAPD-7200 Firmware
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      # --------------------------------------------------
      # 1. Checkout repository
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Install dependencies
      # --------------------------------------------------
      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            clang \
            flex \
            bison \
            g++ \
            gawk \
            gcc-multilib \
            g++-multilib \
            gettext \
            git \
            libncurses-dev \
            libssl-dev \
            python3 \
            python3-setuptools \
            rsync \
            swig \
            unzip \
            zlib1g-dev \
            file \
            wget \
            curl \
            time \
            device-tree-compiler \
            libelf-dev \
            ecj \
            fastjar \
            java-propose-classpath

      # --------------------------------------------------
      # 3. Clone OpenWrt 23.05
      # --------------------------------------------------
      - name: Clone OpenWrt
        run: |
          git clone \
            --depth 1 \
            --branch openwrt-23.05 \
            https://github.com/openwrt/openwrt.git \
            openwrt

          echo "OpenWrt source downloaded."

      # --------------------------------------------------
      # 4. Update feeds
      # --------------------------------------------------
      - name: Update and install feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # --------------------------------------------------
      # 5. Inspect repository
      # --------------------------------------------------
      - name: Inspect repository files
        shell: bash
        run: |
          set -eu

          echo "=== Repository files ==="
          find . -maxdepth 3 -type f -print | head -n 200

          echo "=== src directory ==="

          if [ -d src ]; then
            find src -maxdepth 2 -type f -print
          else
            echo "ERROR: src directory not found."
            exit 1
          fi

          echo "=== DTS files ==="

          find target/linux/ipq40xx/files/arch/arm/boot/dts \
            -type f -print 2>/dev/null || true

      # --------------------------------------------------
      # 6. Install GAPD-7200 device tree
      # --------------------------------------------------
      - name: Install Davolink device tree
        shell: bash
        run: |
          set -euo pipefail

          DTS_DIR="target/linux/ipq40xx/files/arch/arm/boot/dts"

          if [ ! -d "$DTS_DIR" ]; then
            echo "ERROR: Repository DTS directory not found:"
            echo "$DTS_DIR"
            exit 1
          fi

          DTS_SOURCE="$(
            find "$DTS_DIR" -type f \
              -name  qcom-ipq4019-gapd7200.dts  \
              -print -quit
          )"

          if [ -z "$DTS_SOURCE" ]; then
            echo "ERROR: qcom-ipq4019-gapd7200.dts was not found."
            find "$DTS_DIR" -type f -print
            exit 1
          fi

          DTS_DEST="openwrt/target/linux/ipq40xx/files/arch/arm/boot/dts/qcom-ipq4019-gapd7200.dts"

          mkdir -p "$(dirname "$DTS_DEST")"
          cp "$DTS_SOURCE" "$DTS_DEST"

          echo "DTS copied:"
          echo "$DTS_DEST"

          echo "=== Verify board compatibility string ==="

          grep -n -i -E \
             model|compatible|gapd-7200  \
            "$DTS_DEST" || true

      # --------------------------------------------------
      # 7. Install filesystem overlay
      # --------------------------------------------------
      - name: Install filesystem overlay
        shell: bash
        run: |
          set -euo pipefail

          if [ -d files ]; then
            mkdir -p openwrt/files
            cp -a files/. openwrt/files/
            echo "Filesystem overlay installed."
          else
            echo "No files/ directory; skipping overlay."
          fi

      # --------------------------------------------------
      # 8. Register the image definition
      # --------------------------------------------------
      - name: Register Davolink image definition
        working-directory: openwrt
        shell: bash
        run: |
          set -euo pipefail

          EXTRA_FILE="../src/generic-extra.mk"
          IMAGE_FILE="target/linux/ipq40xx/image/generic.mk"

          echo "=== Check image definition source ==="

          if [ ! -f "$EXTRA_FILE" ]; then
            echo "ERROR: $EXTRA_FILE does not exist."
            exit 1
          fi

          echo "=== Source definition contents ==="
          cat "$EXTRA_FILE"

          echo "=== Check upstream image file ==="

          if [ ! -f "$IMAGE_FILE" ]; then
            echo "ERROR: $IMAGE_FILE does not exist."
            find target/linux/ipq40xx/image \
              -maxdepth 2 -type f -print
            exit 1
          fi

          echo "=== Register device definition ==="

          if grep -R -q \
             Device/davolink_gapd-7200  \
            target/linux/ipq40xx/image \
            --include= *.mk ; then

            echo "Device definition already exists."

          else
            printf  \n\n  >> "$IMAGE_FILE"
            cat "$EXTRA_FILE" >> "$IMAGE_FILE"
            echo "Device definition appended to generic.mk."
          fi

          echo "=== Verify device definition ==="

          grep -R -n -A 15 -B 3 \
             Device/davolink_gapd-7200  \
            target/linux/ipq40xx/image \
            --include= *.mk 

          echo "=== Verify TARGET_DEVICES ==="

          grep -R -n \
             TARGET_DEVICES.*davolink_gapd-7200  \
            target/linux/ipq40xx/image \
            --include= *.mk 

      # --------------------------------------------------
      # 9. Inspect OpenWrt image infrastructure
      # --------------------------------------------------
      - name: Inspect image infrastructure
        working-directory: openwrt
        shell: bash
        run: |
          echo "=== Image Makefiles ==="

          find target/linux/ipq40xx/image \
            -maxdepth 2 -type f -name  *.mk  -print

          echo "=== Device image helpers ==="

          grep -R -n \
             Device/FitImageLzma  \
            target/linux/ipq40xx \
            --include= *.mk  || true

          echo "=== Kernel and rootfs image rules ==="

          grep -R -n -E \
             append-kernel|append-rootfs|pad-to|check-size|append-metadata  \
            target/linux/ipq40xx/image \
            --include= *.mk  || true

      # --------------------------------------------------
      # 10. Check DTS build integration
      # --------------------------------------------------
      - name: Check DTS integration
        working-directory: openwrt
        shell: bash
        run: |
          set -euo pipefail

          DTS_FILE="target/linux/ipq40xx/files/arch/arm/boot/dts/qcom-ipq4019-gapd7200.dts"

          if [ ! -f "$DTS_FILE" ]; then
            echo "ERROR: DTS file is missing."
            exit 1
          fi

          echo "=== Check target DTS references ==="

          grep -R -n \
             qcom-ipq4019-gapd7200  \
            target/linux/ipq40xx \
            --include= *.mk  \
            --include= Makefile  || true

          echo "The DTS exists, but a target reference must also be verified."

      # --------------------------------------------------
      # 11. Configure OpenWrt
      # --------------------------------------------------
      - name: Configure OpenWrt target
        working-directory: openwrt
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Check device registration before defconfig ==="

          grep -R -n \
             Device/davolink_gapd-7200  \
            target/linux/ipq40xx/image \
            --include= *.mk 

          grep -R -n \
             TARGET_DEVICES.*davolink_gapd-7200  \
            target/linux/ipq40xx/image \
            --include= *.mk 

          echo "=== Create initial configuration ==="

          cat > .config << EOF 
          CONFIG_TARGET_ipq40xx=y
          CONFIG_TARGET_ipq40xx_generic=y
          CONFIG_TARGET_ipq40xx_generic_DEVICE_davolink_gapd-7200=y
          EOF

          echo "=== Run make defconfig ==="

          make defconfig

          echo "=== Configuration after defconfig ==="

          grep -E \
             ^CONFIG_TARGET_ipq40xx|^CONFIG_TARGET_SUBTARGET  \
            .config || true

      # --------------------------------------------------
      # 12. Registration diagnostics
      # --------------------------------------------------
      - name: Debug Davolink device registration
        if: always()
        working-directory: openwrt
        shell: bash
        run: |
          echo "=========================================="
          echo "Davolink registration diagnostics"
          echo "=========================================="

          echo "=== Device definition ==="

          grep -R -n -A 15 -B 5 \
             davolink_gapd-7200  \
            target/linux/ipq40xx/image \
            target/linux/ipq40xx/Makefile \
            --include= *.mk  || true

          echo "=== DTS files ==="

          find target/linux/ipq40xx \
            -type f \
            \( -iname  *gapd*7200*  -o -iname  *horuspro*  \) \
            -print || true

          echo "=== Device configuration ==="

          grep \
             CONFIG_TARGET_ipq40xx_generic_DEVICE_davolink_gapd-7200  \
            .config || true

          echo "=== Image definitions ==="

          grep -R -n \
             TARGET_DEVICES.*davolink_gapd-7200  \
            target/linux/ipq40xx/image \
            --include= *.mk  || true

          echo "=========================================="

      # --------------------------------------------------
      # 13. Validate device configuration
      # --------------------------------------------------
      - name: Validate Davolink configuration
        working-directory: openwrt
        shell: bash
        run: |
          set -euo pipefail

          if ! grep -q \
             ^CONFIG_TARGET_ipq40xx_generic_DEVICE_davolink_gapd-7200=y$  \
            .config; then

            echo "ERROR: Davolink device profile was removed by make defconfig."
            echo "The device profile is not recognized by the generated configuration."
            echo "Check the registration diagnostics above."
            exit 1
          fi

          echo "Davolink profile is enabled."

      # --------------------------------------------------
      # 14. Download sources
      # --------------------------------------------------
      - name: Download package sources
        working-directory: openwrt
        shell: bash
        run: |
          make download -j8

      # --------------------------------------------------
      # 15. Compile firmware
      # --------------------------------------------------
      - name: Compile OpenWrt
        id: compile
        continue-on-error: true
        working-directory: openwrt
        shell: bash
        run: |
          set -o pipefail
          make -j1 V=s 2>&1 | tee build.log

      # --------------------------------------------------
      # 16. Show build errors
      # --------------------------------------------------
      - name: Show Build Errors
        if: always()
        working-directory: openwrt
        shell: bash
        run: |
          echo "=== Build errors ==="

          if [ -f build.log ]; then
            grep -n -i -E \
               error:|fatal error:|undefined reference|No rule to make target|Error [0-9]|failed  \
              build.log | tail -n 100 || true

            echo "=== Last 150 lines ==="
            tail -n 150 build.log
          else
            echo "build.log does not exist."
          fi

      # --------------------------------------------------
      # 17. List generated images
      # --------------------------------------------------
      - name: List generated images
        if: always()
        working-directory: openwrt
        shell: bash
        run: |
          echo "=== Generated images ==="

          find bin/targets/ipq40xx/generic \
            -maxdepth 2 \
            -type f \
            -printf  %p (%s bytes)\n  2>/dev/null || true

      # --------------------------------------------------
      # 18. Upload logs and artifacts
      # --------------------------------------------------
      - name: Upload build artifacts and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: davolink-gapd7200-build
          if-no-files-found: warn
          path: |
            openwrt/bin/targets/ipq40xx/generic/
            openwrt/build.log
            openwrt/.config

      # --------------------------------------------------
      # 19. Report final result
      # --------------------------------------------------
      - name: Check compilation result
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.compile.outcome }}" != "success" ]; then
            echo "ERROR: OpenWrt compilation failed."
            echo "Download the davolink-gapd7200-build artifact."
            exit 1
          fi

          echo "OpenWrt compilation step completed."
